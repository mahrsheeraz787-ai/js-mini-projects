<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
</head>

<body>
    <h1>Character Counter</h1>

    <textarea id="textInput" maxlength="100" placeholder="Type something..."></textarea>

    <p>Characters: <span id="charCount">0</span>/100</p>
    <p>Words: <span id="wordCount">0</span></p>
    <p>Remaining: <span id="remaining">100</span></p>
    <script>
        const textInput = document.getElementById("textInput");
        const charCount = document.getElementById("charCount");
        const wordCount = document.getElementById("wordCount");
        const remaining = document.getElementById("remaining");
        textInput.addEventListener('input', () => {
            const text = textInput.value;
            charCount.textContent = text.length;
            remaining.textContent = 100 - text.length;
            const words = text.trim().split(/\s+/);
            wordCount.textContent = text.trim() === "" ? 0 : words.length;
        })
    </script>
</body>

</html>
