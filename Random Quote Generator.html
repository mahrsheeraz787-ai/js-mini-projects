<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
</head>

<body>
    <h1>Random Quote Generator</h1>
    <div class="quote__box">
        <p id="quote">Click the button to get a quote</p>
        <h3 id="author">- Unknown</h3>
        <button id="newQuoteBtn">New Quote</button>
    </div>
    <script>
        const quote = document.getElementById('quote');
        const author = document.getElementById('author');
        const newQuoteBtn = document.getElementById('newQuoteBtn');
        const quotes = [
            {
                text: "Practice makes progress.",
                author: "Unknown"
            },
            {
                text: "Code is like humor. When you have to explain it, it’s bad.",
                author: "Cory House"
            },
            {
                text: "First solve the problem, then write the code.",
                author: "John Johnson"
            }
        ];
newQuoteBtn.addEventListener('click', () => {
    const randomIndex = Math.floor(Math.random() * quotes.length);
    quote.textContent = quotes[randomIndex].text;
    author.textContent ="-" + quotes[randomIndex].author;
});
    </script>
</body>

</html>
